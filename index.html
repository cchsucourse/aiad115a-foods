<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高雄米其林必比登美食地圖</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #be123c;
      --primary-dark: #881337;
      --primary-light: #fecdd3;
      --bg-neutral: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-neutral);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header Navbar */
    header {
      background: linear-gradient(135deg, #be123c 0%, #9f1239 100%);
      color: #ffffff;
      padding: 12px 20px;
      box-shadow: 0 4px 12px rgba(190, 18, 60, 0.15);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-brand i {
      font-size: 1.5rem;
      color: #fde047;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-subtitle {
      font-size: 0.75rem;
      opacity: 0.85;
      font-weight: 400;
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      position: relative;
    }

    /* Sidebar Area */
    .sidebar {
      width: 420px;
      min-width: 360px;
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 900;
      box-shadow: 4px 0 16px rgba(0,0,0,0.03);
    }

    /* Control Panel Filters */
    .filter-panel {
      padding: 16px;
      background-color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      background-color: #f8fafc;
    }

    .search-input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(190, 18, 60, 0.1);
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    .select-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-main);
      background-color: #f8fafc;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .select-input:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    .reset-btn:hover {
      text-decoration: underline;
    }

    /* Restaurant Cards List */
    .restaurant-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-neutral);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      border-color: var(--primary-light);
      box-shadow: 0 6px 16px rgba(190, 18, 60, 0.08);
      transform: translateY(-2px);
    }

    .card.active {
      border-color: var(--primary-color);
      background-color: #fff1f2;
      box-shadow: 0 0 0 2px rgba(190, 18, 60, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .badge-district {
      background-color: #e2e8f0;
      color: #334155;
      font-size: 0.725rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .card-category {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--primary-color);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card-info {
      font-size: 0.825rem;
      color: #475569;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-info i {
      width: 14px;
      color: var(--text-muted);
      text-align: center;
    }

    .card-comment {
      font-size: 0.825rem;
      color: #64748b;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      line-height: 1.45;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: #cbd5e1;
    }

    /* Map Area */
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }

    /* Custom Leaflet Popups */
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .popup-content {
      padding: 8px;
    }

    .popup-content h3 {
      font-size: 1.1rem;
      color: var(--primary-color);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .popup-tag {
      display: inline-block;
      background-color: var(--primary-light);
      color: var(--primary-dark);
      font-size: 0.725rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .popup-content p {
      font-size: 0.825rem;
      color: #334155;
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .popup-comment {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
      line-height: 1.4;
    }

    /* Responsive Design */
    @media (max-width: 868px) {
      .main-container {
        flex-direction: column-reverse;
      }

      .sidebar {
        width: 100%;
        min-width: 100%;
        height: 50vh;
        border-right: none;
        border-top: 1px solid var(--border-color);
      }

      #map {
        height: 50vh;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <i class="fa-solid fa-award"></i>
      <div>
        <div class="header-title">高雄米其林必比登美食地圖</div>
        <div class="header-subtitle">2024 - 2026 評選入選指南（完整 22 間收錄）</div>
      </div>
    </div>
  </header>

  <div class="main-container">
    <!-- 左側選單 -->
    <div class="sidebar">
      <div class="filter-panel">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="搜尋店名、地址或關鍵字...">
        </div>

        <div class="filter-group">
          <select id="districtFilter" class="select-input">
            <option value="">全高雄市 (全區域)</option>
          </select>
          <select id="categoryFilter" class="select-input">
            <option value="">全部料理類別</option>
          </select>
        </div>

        <div class="stats-bar">
          <span id="resultCount">正在載入餐廳資訊...</span>
          <button id="resetBtn" class="reset-btn"><i class="fa-solid fa-rotate-left"></i> 重設篩選</button>
        </div>
      </div>

      <div class="restaurant-list" id="restaurantList"></div>
    </div>

    <!-- 右側地圖 -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // CSV 原始資料加上座標數據
    const rawData = [
      {"店名":"永筵小館","類別":"臺灣菜","區域":"前金區","電話":"0966-205-757","地址":"高雄市前金區成功一路528號","評論":"前身為雲來坊家鄉小館，提供經典台菜與家常熱炒，招牌滑蛋蝦仁廣受好評。","lat":22.6206,"lng":120.2974},
      {"店名":"牛老大涮牛肉 (自強二路)","類別":"臺灣菜 / 涮牛肉","區域":"前金區","電話":"07-281-9196","地址":"高雄市前金區自強二路18號","評論":"每日溫體牛肉直送，湯頭鮮美甘甜，配上特製沾醬十分滋味。","lat":22.6235,"lng":120.2971},
      {"店名":"昭明海產家庭料理","類別":"臺灣菜 / 海鮮","區域":"前金區","電話":"07-241-2550","地址":"高雄市前金區自強一路53號","評論":"平價海鮮熱炒與台菜家庭料理，食材新鮮且菜色豐富。","lat":22.6273,"lng":120.2965},
      {"店名":"前金肉燥飯","類別":"小吃","區域":"前金區","電話":"07-272-7263","地址":"高雄市前金區大同二路26號","評論":"數十年老店，肉燥香味濃郁且肥而不膩，搭配半熟蛋極具人氣。","lat":22.6247,"lng":120.2952},
      {"店名":"小燉食室","類別":"臺灣菜 / 燉湯","區域":"前鎮區","電話":"0906-303-309","地址":"高雄市前鎮區廣西路226號","評論":"主打精緻個人養生燉湯與健康定食，湯頭清甜回甘。","lat":22.6095,"lng":120.3125},
      {"店名":"白玉樓","類別":"臺灣菜 / 酒家菜","區域":"前鎮區","電話":"07-823-1118","地址":"高雄市前鎮區中華五路789號 (夢時代購物中心內)","評論":"復古氛圍的台菜與酒家菜餐廳，古早味白菜滷是推薦招牌菜。","lat":22.5951,"lng":120.3068},
      {"店名":"貳哥食堂","類別":"臺灣菜","區域":"鼓山區","電話":"07-554-1123","地址":"高雄市鼓山區青海路145號","評論":"手路台菜與精緻小菜，氣氛溫馨，菜色別具風味。","lat":22.6582,"lng":120.2878},
      {"店名":"良佳豬腳","類別":"小吃","區域":"三民區","電話":"07-392-5533","地址":"高雄市三民區陽明路229號","評論":"豬腳燉煮得軟爛入味、富含膠質，搭配獨門醬汁非常下飯。","lat":22.6441,"lng":120.3440},
      {"店名":"侯記鴨肉飯","類別":"小吃","區域":"三民區","電話":"07-282-7588","地址":"高雄市三民區自強一路201號","評論":"當歸鴨湯頭濃郁香醇，鴨肉飯鮮嫩多汁且份量實惠。","lat":22.6318,"lng":120.2962},
      {"店名":"米院子油飯","類別":"小吃","區域":"新興區","電話":"07-222-6699","地址":"高雄市新興區南海街30號","評論":"文青風油飯專賣店，鴨肉油飯糯米香Q且不油膩。","lat":22.6288,"lng":120.3115},
      {"店名":"春蘭割包","類別":"小吃","區域":"新興區","電話":"07-201-7806","地址":"高雄市新興區復興一路5號","評論":"割包皮Q軟，內餡爌肉可選擇肥瘦，料多實在、香氣十足。","lat":22.6285,"lng":120.3090},
      {"店名":"菜粽李","類別":"小吃","區域":"苓雅區","電話":"07-331-3086","地址":"高雄市苓雅區成功一路159號","評論":"經營數十年的花生菜粽老店，口感綿密扎實，淋上特製醬汁古早味濃郁。","lat":22.6172,"lng":120.2968},
      {"店名":"泰元","類別":"泰國菜","區域":"苓雅區","電話":"07-221-0662","地址":"高雄市苓雅區苓雅二路53號","評論":"道地泰式街頭小吃風味，酸辣夠味，打拋豬與泰式奶茶深受好評。","lat":22.6212,"lng":120.3001},
      {"店名":"北港蔡三代筒仔米糕","類別":"小吃","區域":"鹽埕區","電話":"07-551-7443","地址":"高雄市鹽埕區河西路166號","評論":"愛河旁的鹽埕傳統老店，筒仔米糕軟糯香濃，旗魚環湯與蒸蛋湯是一絕。","lat":22.6268,"lng":120.2818},
      {"店名":"弘記肉燥飯舖","類別":"小吃","區域":"左營區","電話":"07-558-3777","地址":"高雄市左營區立文路96號","評論":"用餐環境明亮乾淨，肉燥飯鹹香夠味，搭配黃金蛋相當美味。","lat":22.6610,"lng":120.3041},
      {"店名":"楊寶寶蒸餃 (朝明路)","類別":"餃子 / 麵食","區域":"楠梓區","電話":"07-351-6600","地址":"高雄市楠梓區朝明路106號","評論":"楠梓高人氣平價美食，蒸餃與牛肉捲餅皮薄餡多、湯汁飽滿。","lat":22.7275,"lng":120.3285},
      {"店名":"橋仔頭黃家肉燥飯","類別":"小吃","區域":"橋頭區","電話":"07-612-3253","地址":"高雄市橋頭區橋南路106號","評論":"橋頭老街知名肉燥飯，切角肉燥膠質滿滿，入口即化。","lat":22.7568,"lng":120.3118},
      {"店名":"廖記米糕","類別":"小吃","區域":"橋頭區","電話":"07-612-8319","地址":"高雄市橋頭區橋南路119號","評論":"老字號筒仔米糕，米粒粒粒分明且帶有肉燥香，搭配四神湯最道地。","lat":22.7572,"lng":120.3120},
      {"店名":"舊市羊肉","類別":"臺灣菜 / 羊肉料理","區域":"岡山區","電話":"07-625-8151","地址":"高雄市岡山區河華路111號","評論":"岡山知名羊肉專賣店，溫體羊肉溫補無腥味，炒羊肉與羊肉爐都是經典。","lat":22.7958,"lng":120.2955},
      {"店名":"湖東牛肉館","類別":"臺灣菜 / 涮牛肉","區域":"湖內區","電話":"07-693-0466","地址":"高雄市湖內區中山路一段107號","評論":"超難預約的高雄溫體牛肉鍋，湯頭鮮甜、肉質極致嫩滑。","lat":22.8948,"lng":120.2115},
      {"店名":"阿香的廚房","類別":"臺灣菜 / 原住民料理","區域":"美濃區","電話":"07-681-7212","地址":"高雄市美濃區中山路二段629號","評論":"融合原住民風味與在地食材的美食，擺盤精緻，蔗香小排與小米粽是亮點。","lat":22.8982,"lng":120.5348},
      {"店名":"秀明豬心冬粉","類別":"小吃","區域":"旗山區","電話":"07-662-4625","地址":"高雄市旗山區永平街41號","評論":"旗山老街在地古早味，豬心新鮮清脆，湯頭清甜無異味。","lat":22.8881,"lng":120.4823}
    ];

    // 初始化地圖（預設中心設於高雄）
    const map = L.map('map').setView([22.65, 120.32], 12);

    // 載入 OpenStreetMap 圖層
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    let markers = [];
    let activeCard = null;

    // 自訂紅/黃米其林標記圖示
    const redIcon = L.divIcon({
      className: 'custom-div-icon',
      html: `<div style="background-color:#be123c; color:white; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.3); font-size:14px;"><i class="fa-solid fa-utensils"></i></div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 初始化下拉選單
    function initFilters() {
      const districts = [...new Set(rawData.map(item => item.區域))];
      const categories = [...new Set(rawData.map(item => item.類別))];

      const districtSelect = document.getElementById('districtFilter');
      districts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });

      const categorySelect = document.getElementById('categoryFilter');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        categorySelect.appendChild(opt);
      });
    }

    // 渲染清單與圖標
    function render(data) {
      // 清除舊標記
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const listEl = document.getElementById('restaurantList');
      listEl.innerHTML = '';
      document.getElementById('resultCount').textContent = `符合條件：${data.length} 間餐廳`;

      if (data.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-utensils"></i>
            <p>沒有找到符合條件的必比登餐廳</p>
          </div>
        `;
        return;
      }

      data.forEach((item, index) => {
        // 建立地圖 Marker
        const marker = L.marker([item.lat, item.lng], { icon: redIcon }).addTo(map);
        
        const popupHtml = `
          <div class="popup-content">
            <h3>${item.店名}</h3>
            <span class="popup-tag">${item.區域} · ${item.類別}</span>
            <p><i class="fa-solid fa-phone" style="color:#be123c"></i> ${item.電話}</p>
            <p><i class="fa-solid fa-location-dot" style="color:#be123c"></i> ${item.地址}</p>
            <div class="popup-comment">${item.評論}</div>
          </div>
        `;
        marker.bindPopup(popupHtml);

        marker.on('click', () => {
          highlightCard(index);
        });

        markers.push(marker);

        // 建立卡片
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${index}`;
        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">${item.店名}</div>
            <span class="badge-district">${item.區域}</span>
          </div>
          <div class="card-category"><i class="fa-solid fa-bowl-food"></i> ${item.類別}</div>
          <div class="card-info"><i class="fa-solid fa-phone"></i> ${item.電話}</div>
          <div class="card-info"><i class="fa-solid fa-location-dot"></i> ${item.地址}</div>
          <div class="card-comment">${item.評論}</div>
        `;

        card.addEventListener('click', () => {
          highlightCard(index);
          map.flyTo([item.lat, item.lng], 15, { duration: 1 });
          marker.openPopup();
        });

        listEl.appendChild(card);
      });

      // 自動縮放地圖涵蓋所有結果
      if (data.length > 0) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.12));
      }
    }

    function highlightCard(index) {
      if (activeCard) {
        activeCard.classList.remove('active');
      }
      const card = document.getElementById(`card-${index}`);
      if (card) {
        card.classList.add('active');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        activeCard = card;
      }
    }

    // 綜合篩選邏輯（關鍵字 + 行政區 + 料理類別）
    function filterData() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedDistrict = document.getElementById('districtFilter').value;
      const selectedCategory = document.getElementById('categoryFilter').value;

      const filtered = rawData.filter(item => {
        const matchKeyword = !keyword || 
          item.店名.toLowerCase().includes(keyword) || 
          item.地址.toLowerCase().includes(keyword) || 
          item.評論.toLowerCase().includes(keyword);

        const matchDistrict = !selectedDistrict || item.區域 === selectedDistrict;
        const matchCategory = !selectedCategory || item.類別 === selectedCategory;

        return matchKeyword && matchDistrict && matchCategory;
      });

      render(filtered);
    }

    // 重設篩選器
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('districtFilter').value = '';
      document.getElementById('categoryFilter').value = '';
      filterData();
    });

    // 綁定事件監聽
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('districtFilter').addEventListener('change', filterData);
    document.getElementById('categoryFilter').addEventListener('change', filterData);

    // 啟動初始化
    initFilters();
    render(rawData);
  </script>
</body>
</html>
